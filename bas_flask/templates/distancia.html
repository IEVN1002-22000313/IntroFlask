{% extends "layout.html" %} {% block container %}
<div class="container mt-4">
  <h2>Calcular Distancia Entre Dos Puntos</h2>
  <form action="/distancia" method="post">
    <div class="mb-3">
      <label for="x1" class="form-label">Coordenada X1:</label>
      <input
        type="number"
        step="any"
        class="form-control"
        id="x1"
        name="x1"
        value="{{ x1 }}"
        required
      />
    </div>

    <div class="mb-3">
      <label for="y1" class="form-label">Coordenada Y1:</label>
      <input
        type="number"
        step="any"
        class="form-control"
        id="y1"
        name="y1"
        value="{{ y1 }}"
        required
      />
    </div>

    <div class="mb-3">
      <label for="x2" class="form-label">Coordenada X2:</label>
      <input
        type="number"
        step="any"
        class="form-control"
        id="x2"
        name="x2"
        value="{{ x2 }}"
        required
      />
    </div>

    <div class="mb-3">
      <label for="y2" class="form-label">Coordenada Y2:</label>
      <input
        type="number"
        step="any"
        class="form-control"
        id="y2"
        name="y2"
        value="{{ y2 }}"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary">Calcular</button>
  </form>

  <h3 class="mt-4">La distancia es: {{ "%.2f"|format(res|float) }}</h3>
</div>
{% endblock %}
